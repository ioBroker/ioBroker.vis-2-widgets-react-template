# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Install Dependencies
              run: npm i

            - name: Build JavaScript (vite) project
              run: npm run build-jsv

            # The TypeScript project is built last, so the tests run against it
            - name: Build TypeScript project
              run: npm run build

            - name: Run local tests
              run: npm test

            - name: Archive screenshots
              if: always()
              # if: failure()
              uses: actions/upload-artifact@v7
              with:
                  path: tmp/screenshots/**/*.png
                  retention-days: 3

    # Deploys the final package to NPM
    deploy:
        needs: [adapter-tests]

        # Trigger this step only when a commit on master is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            # required to create the GitHub release
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js 22.x
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Install Dependencies
              run: npm i

            #      - name: Create a clean build
            #        run: npm run build
            - name: Publish package to npm
              run: |
                  npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
                  npm whoami
                  npm publish

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # The release notes are the body of the release commit. Pre-release versions create pre-releases on GitHub
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  PRERELEASE=""
                  if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
                  git show -s --format=%b > "$RUNNER_TEMP/release-notes.md"
                  gh release create "$GITHUB_REF_NAME" --title "Release v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" $PRERELEASE
